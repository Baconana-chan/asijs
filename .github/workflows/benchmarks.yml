name: Benchmarks Dashboard

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Benchmark iterations'
        required: false
        default: '10000'
      warmup:
        description: 'Warmup iterations'
        required: false
        default: '1000'
      run_ssr_frameworks:
        description: 'Build & benchmark Node SSR frameworks (SvelteKit/Astro/Nuxt — adds ~1-2 min). Set to false to skip (e.g. for a quick run).'
        required: false
        default: 'true'
      run_load_tests:
        description: 'Run k6 load tests (needs Docker)'
        required: false
        default: 'false'
      load_scenario:
        description: 'Load test scenario (auth, crud, websocket, upload, or all)'
        required: false
        default: 'all'
      load_vus:
        description: 'Load test VUs'
        required: false
        default: '50'
      load_duration:
        description: 'Load test duration'
        required: false
        default: '1m'

# Allow one concurrent deployment
concurrency:
  group: benchmark-dashboard
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    outputs:
      has_results: ${{ steps.collect.outputs.has_results }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (root)
        run: bun install

      - name: Install dependencies (bench)
        working-directory: ./bench
        run: bun install

      - name: Build SSR benchmark frameworks
        # Run by default (push events have no inputs → undefined != 'false' is
        # true) so the dashboard always includes the SSR category. Opt out with
        # run_ssr_frameworks=false in a manual run.
        if: github.event.inputs.run_ssr_frameworks != 'false'
        run: bun run bench:ssr:build
        env:
          CI: 'true'

      - name: Run benchmarks
        id: collect
        env:
          BENCH_ITERATIONS: ${{ github.event.inputs.iterations || '10000' }}
          BENCH_WARMUP: ${{ github.event.inputs.warmup || '1000' }}
        run: |
          echo "📊 Running benchmark collector..."
          echo "   BENCH_ITERATIONS=$BENCH_ITERATIONS"
          echo "   BENCH_WARMUP=$BENCH_WARMUP"
          
          # Create results dir upfront
          mkdir -p bench/results
          
          # Run collector — capture both stdout and stderr
          bun run bench:collect 2>&1; EXIT_CODE=$?
          echo ""
          echo "   Exit code: $EXIT_CODE"
          
          # Debug: show results
          echo "   Results dir contents:"
          ls -la bench/results/ 2>&1 || echo "   (no results dir)"
          
          # Check if results were generated
          if [ -f bench/results/latest.json ]; then
            echo "has_results=true" >> $GITHUB_OUTPUT
            echo "   ✅ Results generated successfully"
          else
            echo "has_results=false" >> $GITHUB_OUTPUT
            echo "   ⚠️  No results generated"
          fi

      - name: Generate dashboard
        if: steps.collect.outputs.has_results == 'true'
        env:
          BENCH_ITERATIONS: ${{ github.event.inputs.iterations || '10000' }}
          BENCH_WARMUP: ${{ github.event.inputs.warmup || '1000' }}
        run: |
          # Generate the HTML dashboard into docs/public/benchmarks/
          bun run bench:dashboard
          echo "   ✅ Dashboard generated in docs/public/benchmarks/"

      - name: Commit results and dashboard back to the repo
        if: steps.collect.outputs.has_results == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bench/results/ docs/public/benchmarks/
          if git diff --cached --quiet; then
            echo "   ℹ️  No changes to commit (results unchanged)"
          else
            git commit -m "bench: update benchmark results and dashboard [skip ci]"
            git push
            echo "   ✅ Committed fresh benchmark results + dashboard"
          fi

      - name: Upload benchmark artifacts
        if: steps.collect.outputs.has_results == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            bench/results/
            docs/public/benchmarks/
          retention-days: 90

      - name: Verify dashboard output
        if: steps.collect.outputs.has_results == 'true'
        run: |
          if [ -f docs/public/benchmarks/index.html ]; then
            echo "   📊 Dashboard file: $(wc -c < docs/public/benchmarks/index.html) bytes"
            echo "   ✅ Dashboard ready for vitepress deployment"
          else
            echo "   ⚠️  Dashboard HTML not found"
          fi

      - name: Run load tests (k6 via Docker)
        if: github.event.inputs.run_load_tests == 'true'
        run: |
          echo "🏋️  Running k6 load tests..."
          echo "   SCENARIO=${{ github.event.inputs.load_scenario || 'all' }}"
          echo "   K6_VUS=${{ github.event.inputs.load_vus || '50' }}"
          echo "   K6_DURATION=${{ github.event.inputs.load_duration || '1m' }}"
          
          SCENARIO_FLAG="${{ github.event.inputs.load_scenario }}"
          K6_VUS="${{ github.event.inputs.load_vus || '50' }}"
          K6_DURATION="${{ github.event.inputs.load_duration || '1m' }}"
          
          if [ -z "$SCENARIO_FLAG" ] || [ "$SCENARIO_FLAG" = "all" ]; then
            K6_VUS=$K6_VUS K6_DURATION=$K6_DURATION bun run bench:load
          else
            SCENARIO=$SCENARIO_FLAG K6_VUS=$K6_VUS K6_DURATION=$K6_DURATION bun run bench:load
          fi
          echo "   ✅ k6 load tests complete"

      - name: Summary
        if: steps.collect.outputs.has_results == 'true'
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  📈 Benchmark Dashboard Summary"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Dashboard will be available at:"
          echo "    https://baconana-chan.github.io/asijs/benchmarks/"
          echo "  (after vitepress docs deploy completes)"
          echo ""
          echo "  The dashboard is integrated into the vitepress"
          echo "  docs site via docs/public/benchmarks/"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
