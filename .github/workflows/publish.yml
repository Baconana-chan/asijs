name: Publish

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run in dry-run mode'
        required: false
        default: 'true'
        type: boolean

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: bun install

      - name: Validate tag matches package.json version
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "❌ Tag version v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "✅ Tag v$TAG_VERSION matches package.json version $PKG_VERSION"

      - name: Type check
        run: bun run typecheck

      - name: Run tests
        run: bun test

      - name: Build
        run: bun run build

      - name: Get version
        id: get-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [test-and-build]
    if: ${{ github.event_name == 'release' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish (dry-run)
        if: ${{ github.event.inputs.dry-run == 'true' }}
        run: npm publish --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        if: ${{ github.event.inputs.dry-run != 'true' }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-jsr:
    name: Publish to JSR
    runs-on: ubuntu-latest
    needs: [test-and-build]
    if: ${{ github.event_name == 'release' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Publish to JSR
        run: bunx jsr publish

  create-release-assets:
    name: Create Release Assets
    runs-on: ubuntu-latest
    needs: [test-and-build]
    if: ${{ github.event_name == 'release' }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create tarball
        run: |
          tar -czvf asijs-v${{ needs.test-and-build.outputs.version }}.tar.gz \
            dist/ package.json README.md LICENSE

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: asijs-v${{ needs.test-and-build.outputs.version }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-eslint-plugin:
    name: Publish ESLint Plugin
    runs-on: ubuntu-latest
    needs: [test-and-build]
    if: ${{ github.event_name == 'release' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Read ESLint plugin version
        id: eslint-version
        working-directory: ./packages/eslint-plugin-asijs
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          PKG_NAME=$(node -p "require('./package.json').name")
          echo "version=$PKG_VERSION" >> $GITHUB_OUTPUT
          echo "name=$PKG_NAME" >> $GITHUB_OUTPUT

      - name: Install dependencies
        working-directory: ./packages/eslint-plugin-asijs
        run: npm ci || npm install

      - name: Build ESLint plugin
        working-directory: ./packages/eslint-plugin-asijs
        run: npx tsc

      - name: Check npm registry for existing version
        working-directory: ./packages/eslint-plugin-asijs
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          PKG_NAME=$(node -p "require('./package.json').name")
          EXISTING=$(npm view "$PKG_NAME@$PKG_VERSION" version 2>/dev/null || echo "")
          if [ -n "$EXISTING" ]; then
            echo "⚠️  $PKG_NAME@$PKG_VERSION already exists on npm — skipping"
            echo "already_published=true" >> $GITHUB_ENV
          else
            echo "✅ $PKG_NAME@$PKG_VERSION not found on npm — will publish"
            echo "already_published=false" >> $GITHUB_ENV
          fi

      - name: Publish ESLint plugin (dry-run)
        if: ${{ github.event.inputs.dry-run == 'true' && env.already_published != 'true' }}
        working-directory: ./packages/eslint-plugin-asijs
        run: npm publish --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish ESLint plugin to npm
        if: ${{ (github.event_name == 'release' || github.event.inputs.dry-run != 'true') && env.already_published != 'true' }}
        working-directory: ./packages/eslint-plugin-asijs
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
