name: MiyoCSS CI

on:
  push:
    paths:
      - "packages/MiyoCSS/**"
  pull_request:
    paths:
      - "packages/MiyoCSS/**"

jobs:
  test:
    name: Typecheck + Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install root dependencies
        run: bun install

      - name: Build core (asijs dist for type resolution)
        # src/asi/index.ts and src/core/ssr.ts import "asijs"; its types come
        # from the root package's dist/index.d.ts, which is gitignored.
        run: bun run build

      - name: Install dependencies
        working-directory: ./packages/MiyoCSS
        run: npm install

      - name: Type check
        working-directory: ./packages/MiyoCSS
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: ./packages/MiyoCSS
        run: bun test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: ./packages/MiyoCSS
        run: npm install

      - name: Build
        working-directory: ./packages/MiyoCSS
        run: npx tsc
