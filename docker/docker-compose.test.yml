version: "3.9"

# Integration test infrastructure for AsiJS
# Start with: docker compose -f docker/docker-compose.test.yml up -d
# Stop with:   docker compose -f docker/docker-compose.test.yml down -v

services:

  postgres:
    image: postgres:16-alpine
    container_name: asijs-test-postgres
    environment:
      POSTGRES_USER: asijs
      POSTGRES_PASSWORD: asijs_test
      POSTGRES_DB: asijs_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asijs -d asijs_test"]
      interval: 2s
      timeout: 3s
      retries: 10
    tmpfs: /var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: asijs-test-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: asijs-test-minio
    environment:
      MINIO_ROOT_USER: asijs_test
      MINIO_ROOT_PASSWORD: asijs_test_secret
    ports:
      - "9001:9000"
      - "9002:9001"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 10
    tmpfs: /data
