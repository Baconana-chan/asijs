<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AsiJS Benchmarks</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --green: #3fb950;
      --orange: #d29922;
      --red: #f85149;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }
    h2 {
      font-size: 1.2rem;
      color: var(--accent);
      margin: 1.5rem 0 1rem;
    }
    .subtitle {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }
    .meta {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }
    .meta-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
    }
    .meta-item .label { color: var(--muted); }
    .meta-item .value { color: var(--text); font-weight: 600; }
    .charts-grid {
      display: grid;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    .chart-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
    }
    .chart-card h3 {
      font-size: 1rem;
      margin-bottom: 1rem;
      color: var(--text);
    }
    .chart-card .chart-container {
      position: relative;
      height: 300px;
    }
    .legend-row {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      margin-bottom: 0.75rem;
    }
    .legend-row span {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .legend-row .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }
    .table-wrap {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    th {
      text-align: left;
      padding: 0.5rem 0.75rem;
      background: var(--bg);
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      white-space: nowrap;
    }
    td {
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid var(--border);
    }
    td:first-child { font-weight: 500; }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    .rps-bar {
      display: inline-block;
      height: 16px;
      border-radius: 3px;
      min-width: 4px;
      vertical-align: middle;
      margin-right: 0.5rem;
    }
    .badge {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-green { background: rgba(63, 185, 80, 0.15); color: var(--green); }
    .badge-yellow { background: rgba(210, 153, 34, 0.15); color: var(--orange); }
    .badge-red { background: rgba(248, 81, 73, 0.15); color: var(--red); }
    .trend-up { color: var(--green); }
    .trend-down { color: var(--red); }
    .footer {
      margin-top: 3rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.8rem;
      text-align: center;
    }
    @media (max-width: 768px) {
      body { padding: 1rem; }
      .meta { flex-direction: column; }
    }
  </style>
</head>
<body>
  <h1>⚡ AsiJS Benchmark Dashboard</h1>
  <p class="subtitle">Real-time performance tracking across commits</p>

  <div id="meta" class="meta"></div>

  <div id="charts" class="charts-grid"></div>

  <h2>📋 Detailed Results — Latest Run</h2>
  <div id="table" class="table-wrap"></div>

  <h2>📈 Historical Trends</h2>
  <div class="chart-card">
    <h3>RPS Over Time (Top 5 Frameworks)</h3>
    <div class="chart-container">
      <canvas id="trendChart"></canvas>
    </div>
  </div>

  <div class="footer">
    Generated by AsiJS Benchmark Dashboard —
    <span id="footerTime"></span>
  </div>

  <script>
    const LATEST = {"timestamp":"2026-08-15T12:00:52.661Z","commit":"9c03afc","branch":"main","groups":[{"name":"GET / (simple JSON)","results":[]},{"name":"GET /user/:id (path params)","results":[]},{"name":"GET /search?q=... (query params)","results":[]},{"name":"POST /users (JSON body, explicit parsing)","results":[]},{"name":"POST /users (with validation)","results":[]},{"name":"1. Middleware Overhead (5 middleware chain)","results":[]},{"name":"2. Complex Validation (4-level nested object)","results":[]},{"name":"3a. File Upload (1MB multipart)","results":[{"name":"AsiJS (1MB)","rps":894,"avgMs":1.1182,"errors":0},{"name":"Elysia (1MB)","rps":879,"avgMs":1.1373,"errors":0},{"name":"Hono (1MB)","rps":571,"avgMs":1.7527,"errors":0}]},{"name":"3b. File Upload (5MB multipart)","results":[{"name":"AsiJS (5MB)","rps":108,"avgMs":9.2321,"errors":0},{"name":"Hono (5MB)","rps":94,"avgMs":10.6724,"errors":0},{"name":"Elysia (5MB)","rps":83,"avgMs":12.0359,"errors":0}]},{"name":"4a. Static File Serving (small file)","results":[]},{"name":"4b. Static File Serving (2MB file)","results":[]},{"name":"5. JSX / HTML Rendering (100-row table)","results":[]},{"name":"6a. Blog API - GET /posts (list + pagination)","results":[]},{"name":"6b. Blog API - GET /posts/:id (single post)","results":[]},{"name":"6c. Blog API - POST /posts (auth + validation)","results":[]},{"name":"1. Fully-Loaded GET /api/data","results":[]},{"name":"2. Auth POST /api/posts (JWT + Validation + CORS + Security)","results":[]},{"name":"3. API Gateway GET /api/users/:id/profile (max middleware)","results":[]},{"name":"4a. CRUD API - GET /api/products (list + filter + pagination)","results":[]},{"name":"4b. CRUD API - GET /api/products/:id","results":[]},{"name":"4c. CRUD API - POST /api/products (auth + validation)","results":[]},{"name":"4d. CRUD API - PUT /api/products/:id (auth + partial update)","results":[]},{"name":"5. CORS Preflight OPTIONS /api/data","results":[]},{"name":"6. Security Headers Overhead (bare vs helmet)","results":[]}]};
    const HISTORY = [{"timestamp":"2026-08-15T12:00:52.661Z","commit":"9c03afc","branch":"main","groups":[{"name":"GET / (simple JSON)","results":[]},{"name":"GET /user/:id (path params)","results":[]},{"name":"GET /search?q=... (query params)","results":[]},{"name":"POST /users (JSON body, explicit parsing)","results":[]},{"name":"POST /users (with validation)","results":[]},{"name":"1. Middleware Overhead (5 middleware chain)","results":[]},{"name":"2. Complex Validation (4-level nested object)","results":[]},{"name":"3a. File Upload (1MB multipart)","results":[{"name":"AsiJS (1MB)","rps":894,"avgMs":1.1182,"errors":0},{"name":"Elysia (1MB)","rps":879,"avgMs":1.1373,"errors":0},{"name":"Hono (1MB)","rps":571,"avgMs":1.7527,"errors":0}]},{"name":"3b. File Upload (5MB multipart)","results":[{"name":"AsiJS (5MB)","rps":108,"avgMs":9.2321,"errors":0},{"name":"Hono (5MB)","rps":94,"avgMs":10.6724,"errors":0},{"name":"Elysia (5MB)","rps":83,"avgMs":12.0359,"errors":0}]},{"name":"4a. Static File Serving (small file)","results":[]},{"name":"4b. Static File Serving (2MB file)","results":[]},{"name":"5. JSX / HTML Rendering (100-row table)","results":[]},{"name":"6a. Blog API - GET /posts (list + pagination)","results":[]},{"name":"6b. Blog API - GET /posts/:id (single post)","results":[]},{"name":"6c. Blog API - POST /posts (auth + validation)","results":[]},{"name":"1. Fully-Loaded GET /api/data","results":[]},{"name":"2. Auth POST /api/posts (JWT + Validation + CORS + Security)","results":[]},{"name":"3. API Gateway GET /api/users/:id/profile (max middleware)","results":[]},{"name":"4a. CRUD API - GET /api/products (list + filter + pagination)","results":[]},{"name":"4b. CRUD API - GET /api/products/:id","results":[]},{"name":"4c. CRUD API - POST /api/products (auth + validation)","results":[]},{"name":"4d. CRUD API - PUT /api/products/:id (auth + partial update)","results":[]},{"name":"5. CORS Preflight OPTIONS /api/data","results":[]},{"name":"6. Security Headers Overhead (bare vs helmet)","results":[]}]}];

    const COLORS = [
      '#58a6ff', '#3fb950', '#d29922', '#f85149', '#bc8cff',
      '#79c0ff', '#56d364', '#e3b341', '#ff7b72', '#d2a8ff',
      '#7ee787', '#c69026', '#ffa198', '#c9d1d9',
    ];
    const COLOR_MAP = {};

    function getColor(name) {
      if (!COLOR_MAP[name]) {
        COLOR_MAP[name] = COLORS[Object.keys(COLOR_MAP).length % COLORS.length];
      }
      return COLOR_MAP[name];
    }

    function fmt(num) {
      return num.toLocaleString();
    }

    function fmtTime(iso) {
      const d = new Date(iso);
      return d.toLocaleString();
    }

    function scoreClass(pct) {
      if (pct >= 90) return 'badge-green';
      if (pct >= 70) return 'badge-yellow';
      return 'badge-red';
    }

    // Metadata
    if (LATEST) {
      const meta = document.getElementById('meta');
      meta.innerHTML = [
        '<div class="meta-item"><span class="label">Commit </span><span class="value">' + LATEST.commit + '</span></div>',
        '<div class="meta-item"><span class="label">Branch </span><span class="value">' + LATEST.branch + '</span></div>',
        '<div class="meta-item"><span class="label">Run </span><span class="value">' + fmtTime(LATEST.timestamp) + '</span></div>',
        '<div class="meta-item"><span class="label">Groups </span><span class="value">' + LATEST.groups.length + '</span></div>',
      ].join('');
    }

    // Charts
    if (LATEST) {
      const chartsContainer = document.getElementById('charts');

      LATEST.groups.forEach(function(group, gi) {
        const sorted = [...group.results].sort(function(a, b) { return b.rps - a.rps });
        const best = sorted[0] ? sorted[0].rps : 1;

        const card = document.createElement('div');
        card.className = 'chart-card';
        card.innerHTML =
          '<h3>' + group.name + '</h3>' +
          '<div class="chart-container"><canvas id="chart-' + gi + '"></canvas></div>';

        chartsContainer.appendChild(card);

        const ctx = document.getElementById('chart-' + gi).getContext('2d');
        new Chart(ctx, {
          type: 'bar',
          data: {
            labels: sorted.map(function(r) { return r.name }),
            datasets: [{
              label: 'Requests/sec',
              data: sorted.map(function(r) { return r.rps }),
              backgroundColor: sorted.map(function(r) { return getColor(r.name) }),
              borderRadius: 4,
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: {
                callbacks: {
                  label: function(ctx) {
                    const r = sorted[ctx.dataIndex];
                    return ' ' + fmt(r.rps) + ' req/s  (' + r.avgMs.toFixed(4) + 'ms)';
                  }
                }
              }
            },
            scales: {
              y: {
                beginAtZero: true,
                ticks: { callback: function(v) { return fmt(v) } },
                grid: { color: '#21262d' }
              },
              x: {
                grid: { display: false },
                ticks: { maxRotation: 30 }
              }
            }
          }
        });
      });
    }

    // Table
    if (LATEST) {
      const tableContainer = document.getElementById('table');
      let html = '<table><thead><tr>' +
        '<th>Group</th><th>Framework</th><th class="num">RPS</th><th class="num">Avg (ms)</th>' +
        '<th class="num">vs Best</th><th>Errors</th></tr></thead><tbody>';

      LATEST.groups.forEach(function(group) {
        const sorted = [...group.results].sort(function(a, b) { return b.rps - a.rps });
        const best = sorted[0] ? sorted[0].rps : 1;

        sorted.forEach(function(r, i) {
          const pct = (r.rps / best * 100).toFixed(1);
          const barW = Math.max(4, (r.rps / best * 100));
          html += '<tr>' +
            '<td>' + (i === 0 ? group.name : '') + '</td>' +
            '<td><span class="rps-bar" style="width:' + barW + 'px;background:' + getColor(r.name) + '"></span>' + r.name + '</td>' +
            '<td class="num">' + fmt(r.rps) + '</td>' +
            '<td class="num">' + r.avgMs.toFixed(4) + '</td>' +
            '<td class="num"><span class="badge ' + scoreClass(Number(pct)) + '">' + pct + '%</span></td>' +
            '<td class="num">' + (r.errors > 0 ? '⚠️ ' + r.errors : '—') + '</td>' +
            '</tr>';
        });
      });

      html += '</tbody></table>';
      tableContainer.innerHTML = html;
    }

    // Trend chart
    if (HISTORY.length > 1) {
      // Collect top framework names across history
      const frameworkNames = new Set();
      HISTORY.forEach(function(snap) {
        snap.groups.forEach(function(g) {
          g.results.forEach(function(r) { frameworkNames.add(r.name); });
        });
      });

      // Pick the top 5 most frequent
      const nameCounts = {};
      HISTORY.forEach(function(snap) {
        snap.groups.forEach(function(g) {
          g.results.forEach(function(r) {
            nameCounts[r.name] = (nameCounts[r.name] || 0) + 1;
          });
        });
      });
      const topNames = Object.entries(nameCounts)
        .sort(function(a, b) { return b[1] - a[1] })
        .slice(0, 5)
        .map(function(e) { return e[0] });

      // Build datasets: for each framework, RPS over time
      const datasets = topNames.map(function(name) {
        const data = [];
        HISTORY.forEach(function(snap) {
          // Find first group's result for this name (use simple GET benchmark)
          let rps = null;
          for (const g of snap.groups) {
            const found = g.results.find(function(r) { return r.name === name });
            if (found) { rps = found.rps; break; }
          }
          data.push(rps);
        });

        return {
          label: name,
          data: data,
          borderColor: getColor(name),
          backgroundColor: getColor(name) + '33',
          tension: 0.3,
          fill: false,
          pointRadius: 3,
        };
      });

      const labels = HISTORY.map(function(snap) {
        return snap.commit.slice(0, 7);
      });

      const trendCtx = document.getElementById('trendChart').getContext('2d');
      new Chart(trendCtx, {
        type: 'line',
        data: { labels: labels, datasets: datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { intersect: false, mode: 'nearest' },
          plugins: {
            legend: {
              position: 'bottom',
              labels: { color: '#8b949e', padding: 16 }
            },
            tooltip: {
              callbacks: {
                title: function(items) {
                  const snap = HISTORY[items[0].dataIndex];
                  return snap.commit.slice(0, 7) + ' — ' + fmtTime(snap.timestamp);
                }
              }
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              ticks: { callback: function(v) { return fmt(v) }, color: '#8b949e' },
              grid: { color: '#21262d' }
            },
            x: {
              ticks: { color: '#8b949e' },
              grid: { display: false }
            }
          }
        }
      });
    } else {
      document.getElementById('trendChart').parentElement.innerHTML =
        '<p style="color:var(--muted);text-align:center;padding:3rem">' +
        'Need at least 2 benchmark runs to show trends. ' +
        'Run <code>bun run bench:collect</code> again after making changes.</p>';
    }

    document.getElementById('footerTime').textContent = new Date().toLocaleString();
  </script>
</body>
</html>
